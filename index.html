// ========== SEPARADOR DE SÍLABAS EN ESPAÑOL (mejorado) ==========
function silabear(palabra) {
  if (!palabra) return [];
  palabra = palabra.toLowerCase().trim();
  // Quitar signos
  palabra = palabra.replace(/[^a-záéíóúüñ]/gi, '');

  const vocales = 'aeiouáéíóúü';
  const fuertes = 'aeoáéó';
  const debiles = 'iuíúü';

  // Primero: detectar hiatos y diptongos de forma práctica
  let silabas = [];
  let i = 0;
  const len = palabra.length;

  while (i < len) {
    let silaba = '';

    // Consonantes iniciales del grupo
    while (i < len && !vocales.includes(palabra[i])) {
      silaba += palabra[i];
      i++;
    }

    // Vocal(es)
    if (i < len && vocales.includes(palabra[i])) {
      silaba += palabra[i];
      i++;

      // Posible diptongo / triptongo
      while (i < len && vocales.includes(palabra[i])) {
        const prev = silaba[silaba.length - 1];
        const curr = palabra[i];

        // Hiato: dos fuertes o fuerte + débil acentuada
        const esHiato = (fuertes.includes(prev) && fuertes.includes(curr)) ||
                        (fuertes.includes(prev) && (curr === 'í' || curr === 'ú')) ||
                        ((prev === 'í' || prev === 'ú') && fuertes.includes(curr));

        if (esHiato) {
          break; // nueva sílaba
        } else {
          // Diptongo o triptongo
          silaba += curr;
          i++;
        }
      }
    }

    // Consonantes finales del grupo (hasta siguiente vocal o fin)
    // Regla práctica: si hay 1 consonante va a la siguiente; si hay 2+ se reparte
    let consonantes = '';
    let j = i;
    while (j < len && !vocales.includes(palabra[j])) {
      consonantes += palabra[j];
      j++;
    }

    if (consonantes.length === 0) {
      // fin
    } else if (j >= len) {
      // Final de palabra: todas van a esta sílaba
      silaba += consonantes;
      i = j;
    } else if (consonantes.length === 1) {
      // Una sola: va a la siguiente sílaba
      // (no la añadimos ahora)
    } else {
      // Dos o más: la última va a la siguiente, el resto a esta
      // Excepciones comunes de grupos inseparables: bl, br, cl, cr, dr, fl, fr, gl, gr, pl, pr, tr, ch, ll, rr
      const inseparables = ['bl','br','cl','cr','dr','fl','fr','gl','gr','pl','pr','tr','ch','ll','rr','qu','gu'];
      let sep = consonantes.length - 1;

      // Comprobar si las dos últimas forman grupo inseparable
      if (consonantes.length >= 2) {
        const ultimas2 = consonantes.slice(-2);
        if (inseparables.includes(ultimas2)) {
          sep = consonantes.length - 2;
        }
      }

      silaba += consonantes.slice(0, sep);
      // Las restantes se dejarán para la siguiente iteración (ajustando i)
      i = i + sep;
    }

    if (silaba) silabas.push(silaba);
  }

  // Limpieza final
  return silabas.filter(s => s.length > 0);
}

// Eliminar duplicados
const uniqueWords = [];
const seen = new Set();
for (const item of WORD_DB) {
  const key = item.w.toLowerCase();
  if (!seen.has(key)) {
    seen.add(key);
    uniqueWords.push(item);
  }
}

// ========== ESTADO ==========
let mode = 'normal';
let shuffled = [];
let currentIndex = 0;
let currentWord = null;
let step = 'tonic';
let selectedTonic = -1;
let scoreCorrect = 0;
let scoreWrong = 0;
let isManual = false;
let manualWordData = null;
let lastAccentedWord = ''; // para mostrar la palabra con tilde

// ========== DOM ==========
const wordContainer = document.getElementById('wordContainer');
const instruction = document.getElementById('instruction');
const typeButtons = document.getElementById('typeButtons');
const accentButtons = document.getElementById('accentButtons');
const vowelOptions = document.getElementById('vowelOptions');
const feedback = document.getElementById('feedback');
const resultWordArea = document.getElementById('resultWordArea');
const scoreCorrectEl = document.getElementById('scoreCorrect');
const scoreWrongEl = document.getElementById('scoreWrong');
const manualPanel = document.getElementById('manualPanel');
const manualInput = document.getElementById('manualInput');

// ========== SONIDOS ==========
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, duration, type = 'sine', vol = 0.3) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playSuccess() {
  playTone(523.25, 0.15, 'sine', 0.25);
  setTimeout(() => playTone(659.25, 0.15, 'sine', 0.25), 120);
  setTimeout(() => playTone(783.99, 0.25, 'sine', 0.3), 240);
}

function playError() {
  playTone(200, 0.2, 'sawtooth', 0.2);
  setTimeout(() => playTone(150, 0.3, 'sawtooth', 0.2), 150);
}

function vibrateFail() {
  if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
}

function showConfetti() {
  const colors = ['#ff9800', '#4caf50', '#2196f3', '#e91e63', '#9c27b0', '#ffeb3b'];
  for (let i = 0; i < 45; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
    c.style.animationDelay = Math.random() * 0.4 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

function shuffle(array) {
  const a = [...array];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function stripAccents(str) {
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

// ========== LÓGICA ==========
function initShuffle() {
  shuffled = shuffle(uniqueWords);
  currentIndex = 0;
}

function nextWord() {
  feedback.textContent = '';
  feedback.className = 'feedback';
  resultWordArea.innerHTML = '';
  selectedTonic = -1;
  step = 'tonic';
  typeButtons.classList.add('hidden');
  accentButtons.classList.add('hidden');
  lastAccentedWord = '';

  if (mode === 'manual') {
    if (!manualWordData) {
      instruction.textContent = 'Escribe una palabra y pulsa "Usar esta palabra"';
      wordContainer.innerHTML = '';
      return;
    }
    currentWord = manualWordData;
  } else {
    if (currentIndex >= shuffled.length) initShuffle();
    currentWord = shuffled[currentIndex];
    currentIndex++;
  }

  renderWord();
  instruction.textContent = 'Toca la sílaba tónica';
}

function renderWord() {
  wordContainer.innerHTML = '';
  const usePlain = (mode === 'hard') || (mode === 'manual' && currentWord.fromManual);
  const syllables = usePlain
    ? currentWord.s.map(syl => stripAccents(syl))
    : currentWord.s;

  syllables.forEach((syl, i) => {
    const span = document.createElement('span');
    span.className = 'syllable';
    span.textContent = syl;
    span.dataset.index = i;
    span.addEventListener('click', () => onSyllableClick(i));
    wordContainer.appendChild(span);
  });
}

function onSyllableClick(index) {
  if (step !== 'tonic') return;

  const syllables = wordContainer.querySelectorAll('.syllable');
  syllables.forEach(s => s.classList.remove('selected', 'correct', 'wrong'));

  selectedTonic = index;
  syllables[index].classList.add('selected');

  // En modo manual con palabra desconocida no puntuamos estrictamente
  const strict = !(mode === 'manual' && currentWord.fromManual && !currentWord.known);

  if (!strict || index === currentWord.t) {
    syllables[index].classList.add('correct');
    playSuccess();
    setTimeout(() => {
      step = 'type';
      instruction.textContent = '¿Es esdrújula, llana o aguda?';
      typeButtons.classList.remove('hidden');
    }, 400);
  } else {
    syllables[index].classList.add('wrong');
    playError();
    vibrateFail();
    scoreWrong++;
    scoreWrongEl.textContent = scoreWrong;
    feedback.textContent = '¡Inténtalo de nuevo! Esa no es la sílaba tónica.';
    feedback.className = 'feedback wrong';
    setTimeout(() => {
      syllables[index].classList.remove('selected', 'wrong');
      selectedTonic = -1;
      feedback.textContent = '';
      feedback.className = 'feedback';
    }, 1300);
  }
}

// Botones de tipo (orden: esdrújula - llana - aguda)
document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (step !== 'type') return;
    const chosen = btn.dataset.type;
    const strict = !(mode === 'manual' && currentWord.fromManual && !currentWord.known);

    if (!strict || chosen === currentWord.tipo) {
      playSuccess();
      if (strict) {
        scoreCorrect++;
        scoreCorrectEl.textContent = scoreCorrect;
      }
      feedback.textContent = '¡Muy bien! ¡Correcto!';
      feedback.className = 'feedback correct';
      showConfetti();

      if (mode === 'hard' || (mode === 'manual' && currentWord.fromManual)) {
        setTimeout(() => {
          step = 'accent';
          instruction.textContent = 'Toca la vocal que debe llevar tilde (o indica que no lleva)';
          typeButtons.classList.add('hidden');
          showAccentOptions();
        }, 900);
      } else {
        setTimeout(() => nextWord(), 1300);
      }
    } else {
      playError();
      vibrateFail();
      scoreWrong++;
      scoreWrongEl.textContent = scoreWrong;
      feedback.textContent = '¡Casi! Prueba otra vez.';
      feedback.className = 'feedback wrong';
      setTimeout(() => {
        feedback.textContent = '';
        feedback.className = 'feedback';
      }, 1300);
    }
  });
});

function showAccentOptions() {
  accentButtons.classList.remove('hidden');
  vowelOptions.innerHTML = '';
  resultWordArea.innerHTML = '';

  const plain = stripAccents(currentWord.w);
  const vowels = 'aeiouáéíóúü';
  let html = '';
  for (let i = 0; i < plain.length; i++) {
    const ch = plain[i];
    if (vowels.includes(ch.toLowerCase())) {
      html += `<span class="vowel-option" data-pos="${i}">${ch}</span>`;
    } else {
      html += `<span style="font-size:clamp(2.2rem,8vw,3.6rem);padding:6px;">${ch}</span>`;
    }
  }
  vowelOptions.innerHTML = html;

  vowelOptions.querySelectorAll('.vowel-option').forEach(el => {
    el.addEventListener('click', () => {
      vowelOptions.querySelectorAll('.vowel-option').forEach(v => v.classList.remove('selected'));
      el.classList.add('selected');
      checkAccent(parseInt(el.dataset.pos), el.textContent);
    });
  });
}

document.getElementById('btnNoTilde').addEventListener('click', () => {
  if (step !== 'accent') return;
  const strict = !(mode === 'manual' && currentWord.fromManual && !currentWord.known);

  if (!strict || !currentWord.tilde) {
    playSuccess();
    if (strict) {
      scoreCorrect++;
      scoreCorrectEl.textContent = scoreCorrect;
    }
    // Mostrar la palabra final
    const finalWord = currentWord.w;
    resultWordArea.innerHTML = `<div class="result-word">${finalWord}</div>`;
    feedback.textContent = '¡Perfecto! No lleva tilde.';
    feedback.className = 'feedback correct';
    showConfetti();
    setTimeout(() => nextWord(), 1800);
  } else {
    playError();
    vibrateFail();
    scoreWrong++;
    scoreWrongEl.textContent = scoreWrong;
    feedback.textContent = 'Esta palabra sí lleva tilde. ¡Inténtalo!';
    feedback.className = 'feedback wrong';
  }
});

function checkAccent(pos, letter) {
  if (step !== 'accent') return;
  const strict = !(mode === 'manual' && currentWord.fromManual && !currentWord.known);

  // Calcular posición correcta de la tilde
  let correctPos = -1;
  if (currentWord.tilde && currentWord.tildeSyl >= 0) {
    let charCount = 0;
    for (let i = 0; i < currentWord.tildeSyl; i++) {
      charCount += stripAccents(currentWord.s[i]).length;
    }
    const sylPlain = stripAccents(currentWord.s[currentWord.tildeSyl]);
    const vowels = 'aeiou';
    for (let j = 0; j < sylPlain.length; j++) {
      if (vowels.includes(sylPlain[j].toLowerCase())) {
        correctPos = charCount + j;
        break;
      }
    }
  }

  if (!strict || (currentWord.tilde && pos === correctPos)) {
    playSuccess();
    if (strict) {
      scoreCorrect++;
      scoreCorrectEl.textContent = scoreCorrect;
    }

    // Construir y mostrar la palabra CON la tilde
    const plain = stripAccents(currentWord.w);
    const accentMap = {'a':'á','e':'é','i':'í','o':'ó','u':'ú'};
    let accented = '';
    for (let i = 0; i < plain.length; i++) {
      if (i === pos && accentMap[plain[i].toLowerCase()]) {
        accented += accentMap[plain[i].toLowerCase()];
      } else {
        accented += plain[i];
      }
    }
    // Preferir la forma original de la base de datos si existe
    const finalDisplay = currentWord.known ? currentWord.w : accented;

    resultWordArea.innerHTML = `<div class="result-word">${finalDisplay}</div>`;
    feedback.textContent = '¡Excelente! Tilde colocada correctamente.';
    feedback.className = 'feedback correct';
    showConfetti();
    setTimeout(() => nextWord(), 2000);
  } else if (!currentWord.tilde) {
    playError();
    vibrateFail();
    scoreWrong++;
    scoreWrongEl.textContent = scoreWrong;
    feedback.textContent = 'Esta palabra no lleva tilde.';
    feedback.className = 'feedback wrong';
  } else {
    playError();
    vibrateFail();
    scoreWrong++;
    scoreWrongEl.textContent = scoreWrong;
    feedback.textContent = 'No es esa vocal. ¡Prueba otra!';
    feedback.className = 'feedback wrong';
  }
}

// ========== CONTROLES ==========
document.getElementById('btnNew').addEventListener('click', () => {
  if (mode === 'manual') {
    manualWordData = null;
    manualInput.value = '';
  }
  nextWord();
});

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    isManual = mode === 'manual';
    manualPanel.classList.toggle('active', isManual);
    if (!isManual) {
      manualWordData = null;
      initShuffle();
    }
    nextWord();
  });
});

document.getElementById('btnManualOk').addEventListener('click', () => {
  let text = manualInput.value.trim().toLowerCase();
  if (!text) return;

  // Buscar en la base de datos
  const found = uniqueWords.find(w => 
    w.w.toLowerCase() === text || 
    stripAccents(w.w).toLowerCase() === stripAccents(text)
  );

  if (found) {
    manualWordData = {...found, fromManual: true, known: true};
  } else {
    // Separación automática mejorada
    const silabas = silabear(text);
    // Aproximación de tónica (llana por defecto, muy común)
    let tIndex = Math.max(0, silabas.length - 2);
    let tipo = 'llana';
    if (silabas.length === 1) {
      tIndex = 0;
      tipo = 'aguda';
    } else if (silabas.length >= 3) {
      // No sabemos, dejamos llana como default
      tipo = 'llana';
    }

    manualWordData = {
      w: text,
      s: silabas,
      t: tIndex,
      tipo: tipo,
      tilde: /[áéíóú]/.test(text),
      tildeSyl: 0,
      fromManual: true,
      known: false
    };
    feedback.textContent = 'Palabra nueva: sílabas automáticas. La puntuación es orientativa.';
    feedback.className = 'feedback';
  }
  nextWord();
});

// Pantalla completa (icono)
document.getElementById('btnFullscreen').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => {
      alert('No se pudo activar pantalla completa');
    });
  } else {
    document.exitFullscreen();
  }
});

// Inicializar
initShuffle();
nextWord();
</script>
